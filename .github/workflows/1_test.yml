name: Tests

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags:
      - "*.*.*"
    paths:
      - "examples/**"
      - "litestar_pagination/**"
      - "README.md"
      - "CHANGELOG.md"
      - "LICENSE"
      - "docs/**"
      - "tests/**"
      - ".pre-commit-config.yaml"
      - "pyproject.toml"
      - "uv.lock"
      - "justfile"
      - "zensical.toml"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "examples/**"
      - "litestar_pagination/**"
      - "README.md"
      - "CHANGELOG.md"
      - "LICENSE"
      - "docs/**"
      - "tests/**"
      - ".pre-commit-config.yaml"
      - "pyproject.toml"
      - "uv.lock"
      - "justfile"
      - "zensical.toml"
      - ".github/workflows/**"
  merge_group:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Test job: id-token write is required for OIDC JWT (GitHub Actions OIDC reference).
# Codecov: use_oidc per codecov-action README; token alternative in Codecov token docs.
# https://docs.github.com/en/actions/deployment/security-hardening-your-deployments/about-security-hardening-with-openid-connect
# https://github.com/codecov/codecov-action#using-oidc
# https://docs.codecov.com/docs/codecov-tokens

env:
  VENV_PRECOMMIT_CACHE_VERSION: v1

jobs:
  prek:
    if: github.event.repository.fork == false
    name: Prek
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_PYTHON_PREFERENCE: only-managed
      # Same as prek: skip hooks that are CI-inappropriate on default branch / shared runners.
      SKIP: detect-aws-credentials,no-commit-to-branch
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set uv Python install dir
        run: echo "UV_PYTHON_INSTALL_DIR=${RUNNER_TEMP}/uv-python-dir" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          python-version: "3.12"
          enable-cache: true
          cache-python: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Local hooks use `uv run` (language: system); cache .venv like the former prek job.
      # prek-action also caches the prek hook environment (default cache: true).
      # Key includes run_id + run_attempt so "Re-run jobs" does not try to save the same
      # cache key twice (GitHub: "another job may be creating this cache").
      # restore-keys restores any prior attempt for this OS/Python; uv sync fixes deps if needed.
      # See: https://github.com/actions/cache/blob/main/tips-and-workarounds.md#update-a-cache
      - name: Restore .venv cache (prek / uv run hooks)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv
          key: venv-precommit-${{ env.VENV_PRECOMMIT_CACHE_VERSION }}-${{ runner.os }}-3.12-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            venv-precommit-${{ env.VENV_PRECOMMIT_CACHE_VERSION }}-${{ runner.os }}-3.12-

      - name: Install the project
        run: uv sync --frozen --all-extras --group dev

      - name: Save .venv cache (prek / uv run hooks)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv
          key: venv-precommit-${{ env.VENV_PRECOMMIT_CACHE_VERSION }}-${{ runner.os }}-3.12-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Run prek
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        with:
          cache: true

  test:
    name: Test (${{ matrix.python-version }} on ${{ matrix.os }})
    needs: [prek]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    if: github.event.repository.fork == false
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"
        os:
          - ubuntu-latest
          - macos-latest
          - windows-2025-vs2026
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-python: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add .local/bin to Windows PATH
        if: runner.os == 'Windows'
        shell: bash
        run: echo "$USERPROFILE/.local/bin" >> "$GITHUB_PATH"

      - name: Clear Python install dir (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: rm -rf "${UV_PYTHON_INSTALL_DIR:-}" 2>/dev/null || true

      - name: Set up Python
        shell: bash
        run: uv python install ${{ matrix.python-version }}

      - name: Install the project
        run: uv sync --frozen --all-extras --group dev

      # Install the coverage subprocess startup hook so pytest-cov measures
      # import-time class/function definitions in modules that pytest-cov
      # imports during plugin discovery (otherwise instrumentation starts
      # after those modules are already in sys.modules).
      # See: https://coverage.readthedocs.io/en/latest/subprocess.html
      - name: Install coverage subprocess hook
        run: >-
          uv run python -c
          "import sysconfig, pathlib;
          p = pathlib.Path(sysconfig.get_paths()['purelib']) / 'coverage_subprocess.pth';
          p.write_text('import coverage; coverage.process_startup()\n');
          print(f'Installed {p}')"

      - name: Detect dead fixtures
        run: uv run pytest --dead-fixtures

      - name: Run tests (coverage + XML for Codecov)
        env:
          COVERAGE_PROCESS_START: pyproject.toml
        run: >-
          uv run pytest
          --cov=litestar_pagination
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=100
          -n auto

      # Codecov flags: ^[\w.\-]{1,45}$ (alphanumeric, _, -, .); see https://docs.codecov.com/docs/flags
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          fail_ci_if_error: true
          files: coverage.xml
          flags: ${{ matrix.os }}
          name: py-${{ matrix.python-version }}-${{ matrix.os }}
          use_oidc: true

  package:
    name: Build and base-wheel smoke test
    needs: [prek]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          python-version: "3.12"
          enable-cache: true
          cache-python: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build distributions
        env:
          SOURCE_DATE_EPOCH: "0"
        run: python scripts/release_artifacts.py build --dist-dir dist

      - name: Verify source-distribution manifest
        shell: bash
        run: |
          archive=(dist/*.tar.gz)
          members=$(tar -tzf "${archive[0]}")
          prohibited='/(\.github|\.vscode|context7\.json|uv\.lock)(/|$)'
          if grep -Eq "$prohibited" <<< "$members"; then
            grep -E "$prohibited" <<< "$members"
            exit 1
          fi
          grep -Eq '/litestar_pagination/py\.typed$' <<< "$members"
          grep -Eq '/tests/unit/test_imports\.py$' <<< "$members"

      - name: Install base wheel in an isolated environment
        shell: bash
        run: |
          uv venv --python 3.12 .venv-wheel
          wheel=(dist/*.whl)
          uv pip install --python .venv-wheel/bin/python "${wheel[0]}"

      - name: Verify base API and optional-import isolation
        run: >-
          .venv-wheel/bin/python -c
          "import importlib.resources, importlib.util;
          from litestar_pagination import CursorPage, CursorParams;
          assert CursorParams().size == 50;
          assert CursorPage is not None;
          assert importlib.resources.files('litestar_pagination').joinpath('py.typed').is_file();
          assert importlib.util.find_spec('sqlalchemy') is None;
          assert importlib.util.find_spec('sqlakeyset') is None;
          assert importlib.util.find_spec('advanced_alchemy') is None"

      - name: Install and verify the complete integration extra
        shell: bash
        run: |
          uv venv --python 3.12 .venv-wheel-integrations
          wheel=(dist/*.whl)
          uv pip install --python .venv-wheel-integrations/bin/python "${wheel[0]}[advanced-alchemy]"
          .venv-wheel-integrations/bin/python -c \
            "import advanced_alchemy; from litestar_pagination.ext.sqlalchemy import apaginate, paginate; assert advanced_alchemy and apaginate and paginate"

  docs:
    name: Documentation build
    needs: [prek]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          python-version: "3.12"
          enable-cache: true
          cache-python: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build documentation
        run: uv run --frozen --group docs zensical build --clean

  postgres:
    name: PostgreSQL matrix
    needs: [prek]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.repository.fork == false
    services:
      postgres:
        image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_DB: pagination
          POSTGRES_PASSWORD: pagination
          POSTGRES_USER: pagination
        options: >-
          --health-cmd "pg_isready -U pagination -d pagination"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      TEST_POSTGRES_ASYNC_DSN: postgresql+asyncpg://pagination:pagination@127.0.0.1:5432/pagination
      TEST_POSTGRES_DSN: postgresql+psycopg://pagination:pagination@127.0.0.1:5432/pagination
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          python-version: "3.12"
          enable-cache: true
          cache-python: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        run: uv python install 3.12

      - name: Run full test suite against PostgreSQL
        run: |
          uv run --group dev just setup
          uv run --group dev just test

  required-checks:
    name: Required checks
    needs: [prek, test, package, docs, postgres]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require successful verification
        env:
          PREK_RESULT: ${{ needs.prek.result }}
          TEST_RESULT: ${{ needs.test.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          POSTGRES_RESULT: ${{ needs.postgres.result }}
        run: |
          set -euo pipefail
          for result in "$PREK_RESULT" "$TEST_RESULT" "$PACKAGE_RESULT" "$DOCS_RESULT" "$POSTGRES_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "A required verification job concluded: $result" >&2
              exit 1
            fi
          done

  dispatch-release:
    name: Dispatch verified release
    needs: [required-checks]
    if: github.event_name == 'workflow_dispatch' && github.ref_type == 'tag' && needs.required-checks.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
      contents: read
    steps:
      - name: Run release workflow for the tested tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          TESTS_RUN_ID: ${{ github.run_id }}
        run: gh workflow run 3_release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG" -f tests_run_id="$TESTS_RUN_ID"
